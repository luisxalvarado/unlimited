<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Intelligence | Unlimited Leverage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="grain"></div>
    <div class="app">

        <!-- Header -->
        <div id="header" class="header"></div>

        <!-- Status Row (5 KPIs) -->
        <div id="status-row" class="status-row"></div>

        <!-- Row 1: Revenue Chart + Income Statement -->
        <div class="grid-wide">
            <div class="panel">
                <div class="panel-hdr">
                    <div class="panel-title">Revenue &amp; Net Income</div>
                </div>
                <div class="chart-wrap">
                    <canvas id="revenue-chart"></canvas>
                </div>
            </div>
            <div id="income-statement" class="panel" style="overflow:auto"></div>
        </div>

        <!-- Row 2: Net Worth Chart + Prosperity -->
        <div class="grid-wide">
            <div class="panel">
                <div class="panel-hdr">
                    <div class="panel-title">Net Worth &amp; Liquid Assets</div>
                </div>
                <div class="chart-wrap">
                    <canvas id="networth-chart"></canvas>
                </div>
            </div>
            <div id="prosperity-panel" class="panel"></div>
        </div>

        <!-- Row 3: Lifestyle Chart + Wealth Coach -->
        <div class="grid-wide">
            <div class="panel">
                <div class="panel-hdr">
                    <div class="panel-title">Lifestyle Expenses</div>
                    <div id="lifestyle-badge" class="panel-badge"></div>
                </div>
                <div class="chart-wrap">
                    <canvas id="lifestyle-chart"></canvas>
                </div>
            </div>
            <div id="wealth-coach" class="panel"></div>
        </div>

        <!-- Row 4: Asset Library + Selling Priority -->
        <div class="grid-wide">
            <div id="asset-library" class="panel"></div>
            <div id="selling-priority" class="panel"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
